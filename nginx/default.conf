# ==============================================================================
# Nginx Reverse Proxy Configuration cho LibMaster System
# Tích hợp đầy đủ Security Headers & Network Hardening
# ==============================================================================

# Cấu hình Upstream trỏ đến Node.js App trong mạng nội bộ
upstream libmaster_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Giới hạn kích thước body request (cho upload ảnh bìa, dữ liệu)
    client_max_body_size 20M;

    # ==========================================================================
    # CẤU HÌNH ĐẦY ĐỦ SECURITY HEADERS (BẢO MẬT HỆ THỐNG - HARDENING)
    # ==========================================================================
    # 1. Chống Clickjacking: Ngăn chặn website bị nhúng vào iframe trên trang giả mạo
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 2. Chống XSS (Cross-Site Scripting): Kích hoạt bộ lọc chống XSS của trình duyệt
    add_header X-XSS-Protection "1; mode=block" always;

    # 3. Chống MIME-Sniffing: Ép trình duyệt tuân thủ MIME type từ server gửi về
    add_header X-Content-Type-Options "nosniff" always;

    # 4. Bảo vệ thông tin Referrer khi chuyển hướng liên kết
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Giới hạn quyền truy cập tài nguyên phần cứng trình duyệt
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 6. Content Security Policy (CSP): Cho phép nội dung an toàn và các CDN cần thiết
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:* ws://localhost:*;" always;

    # ==========================================================================
    # TỐI ƯU HÓA NÉN GZIP
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ==========================================================================
    # REVERSE PROXY CHÍNH CHUYỂN TIẾP SANG APP:3000
    # ==========================================================================
    location / {
        proxy_pass http://libmaster_app;
        proxy_http_version 1.1;

        # Thiết lập các Header chuyển tiếp chuẩn
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình Timeouts kết nối
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Caching & Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ==========================================================================
    # NGINX HEALTHCHECK ENDPOINT
    # ==========================================================================
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Trang thông báo lỗi tùy chỉnh
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
