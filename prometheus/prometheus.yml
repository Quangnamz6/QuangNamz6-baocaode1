# ==============================================================================
# Prometheus Configuration cho LibMaster System
# Thu thập metrics từ chính Prometheus, cAdvisor (8080) và LibMaster App (3000)
# ==============================================================================

global:
  scrape_interval: 15s      # Chu kỳ thu thập metrics mặc định (15 giây)
  evaluation_interval: 15s  # Chu kỳ tính toán alert rules
  scrape_timeout: 10s       # Thời gian chờ tối đa cho một lần scrape

# Cấu hình các mục tiêu thu thập (Scrape Targets)
scrape_configs:
  # 1. Thu thập metrics từ chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'
          service: 'monitoring'

  # 2. Thu thập metrics tài nguyên từ cAdvisor (Docker Containers: CPU, RAM, Network, Disk)
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          environment: 'production'
          service: 'container-metrics'

  # 3. Thu thập metrics ứng dụng từ LibMaster App (Node.js Express)
  - job_name: 'libmaster-app'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          environment: 'production'
          service: 'web-application'
