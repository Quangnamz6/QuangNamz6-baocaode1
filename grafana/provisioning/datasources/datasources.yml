# ==============================================================================
# Grafana Datasources Provisioning cho LibMaster System
# Tự động kết nối Prometheus (Metrics) và Loki (Logs) khi khởi chạy
# ==============================================================================

apiVersion: 1

datasources:
  # 1. Prometheus Datasource (Thu thập Metrics từ cAdvisor và App)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  # 2. Loki Datasource (Thu thập Logs từ Promtail)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
